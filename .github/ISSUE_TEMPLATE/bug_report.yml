name: 🐞 Bug report
description: Something in OrcaPod doesn't work as it should, or the app crashes
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug in OrcaPod. Please search the existing issues first. If yours is already there, add a comment to it instead.
  - type: input
    id: version
    attributes:
      label: OrcaPod version
      description: The app version, or the Actions run you downloaded the APK from.
      placeholder: e.g. 0.1.0, or a link to the workflow run
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 8, Android 15
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Printer profile
      description: The printer, filament and process profiles that were selected, if the bug is about slicing.
      placeholder: e.g. Bambu Lab P1S 0.4 nozzle, Generic PLA, 0.20mm Standard
    validations:
      required: false
  - type: textarea
    id: reproduce_steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. Import '...'
        2. Tap '...'
        3. See the problem
    validations:
      required: true
  - type: textarea
    id: actual_results
    attributes:
      label: What happened
      description: A screenshot or screen recording helps a lot.
    validations:
      required: true
  - type: textarea
    id: expected_results
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Model, project or log
      description: |
        Attach the model or 3MF project if the bug depends on it (zip anything that isn't an image or `.txt`). For a crash, a log from `adb logcat` helps.
    validations:
      required: false
