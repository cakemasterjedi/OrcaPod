name: Android

# Builds the headless engine and the Android app, and runs their tests:
#   host     the engine for Linux with its contract tests and CLI smoke test,
#            then the app's JNI layer on the desktop JVM (EngineHostTest)
#   android  the engine cross-compiled for arm64-v8a (CLI smoke test under
#            qemu), the app's unit tests and the debug APK, uploaded as an
#            artifact
# See mobile/bridge/README.md and mobile/android/README.md for the same steps
# run by hand.
on:
  pull_request:
    paths: &paths
      - 'mobile/**'
      - 'src/libslic3r/**'
      - 'deps_src/**'
      - 'resources/profiles/**'
      - 'version.inc'
      - '.github/workflows/android.yml'
  push:
    branches:
      - main
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018
  # GitHub's Linux runners have 4 cores.
  ORCAPOD_JOBS: 4
  # Every compile goes through ccache, whose cache is carried from run to run
  # (see the compiler cache steps), so a run recompiles only what changed.
  # The NDK and clang are installed fresh on every runner: hash the compiler
  # itself rather than its timestamp.
  ORCAPOD_CCACHE: 1
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPILERTYPE: clang
  CCACHE_MAXSIZE: 3G

jobs:
  host:
    name: Engine and JNI tests (Linux host)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build ccache libgmp-dev libmpfr-dev
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # Boost, CGAL, Eigen, oneTBB and the other pinned engine sources.
      - name: Cache engine sources
        uses: actions/cache@v6
        with:
          path: mobile/bridge/cache
          key: engine-sources-host-${{ hashFiles('mobile/bridge/engine-sources.sh', 'mobile/bridge/tools/gen_nlopt.py') }}
      # A PR run starts from its own last cache, or else main's.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-host-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-host-
      - name: Start the compiler cache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_RUN_START=$(date +%s)" >> "$GITHUB_ENV"
          CCACHE_DIR="$HOME/.ccache" ccache --zero-stats
      - name: Build the engine and run its tests
        run: mobile/bridge/build-host.sh --test
      - name: Run the app's JNI tests
        run: mobile/android/tools/host-jni-test.sh
      # Saved even when a step failed, so the files that compiled are reused.
      # Entries this run did not use are dropped first, keeping each saved
      # cache to one build.
      - name: Trim the compiler cache
        if: ${{ !cancelled() }}
        run: |
          ccache --show-stats
          ccache --evict-older-than "$(( $(date +%s) - CCACHE_RUN_START + 60 ))s"
      - name: Save the compiler cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-host-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: host-test-reports
          path: mobile/android/app/build/reports/tests/
          if-no-files-found: ignore

  android:
    name: Android engine and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build ccache qemu-user
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install the Android NDK and SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;3.22.1" "platforms;android-35" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      # The pinned engine sources, plus the GMP and MPFR tarballs (checked
      # against their SHA-256 on every build).
      - name: Cache engine sources
        uses: actions/cache@v6
        with:
          path: mobile/bridge/cache
          key: engine-sources-android-${{ hashFiles('mobile/bridge/engine-sources.sh', 'mobile/bridge/tools/gen_nlopt.py', 'mobile/bridge/build-android.sh') }}
      # A PR run starts from its own last cache, or else main's.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-android-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-android-
      - name: Start the compiler cache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_RUN_START=$(date +%s)" >> "$GITHUB_ENV"
          CCACHE_DIR="$HOME/.ccache" ccache --zero-stats
      - name: Build the engine for arm64-v8a and run the CLI smoke test
        run: mobile/bridge/build-android.sh --test
      - name: Run the app's unit tests and build the APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      # Saved even when a step failed, so the files that compiled are reused.
      # Entries this run did not use are dropped first, keeping each saved
      # cache to one build.
      - name: Trim the compiler cache
        if: ${{ !cancelled() }}
        run: |
          ccache --show-stats
          ccache --evict-older-than "$(( $(date +%s) - CCACHE_RUN_START + 60 ))s"
      - name: Save the compiler cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-android-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: orcapod-apk
          path: mobile/android/app/build/outputs/apk/debug/OrcaPod-*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: mobile/android/app/build/reports/tests/
          if-no-files-found: ignore
