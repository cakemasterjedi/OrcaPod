name: Android

# Builds the headless engine and the Android app, and runs their tests:
#   host     the engine for Linux with its contract tests and CLI smoke test,
#            then the app's JNI layer on the desktop JVM (EngineHostTest)
#   android  the engine cross-compiled for arm64-v8a (CLI smoke test under
#            qemu), the app's unit tests and the debug APK, uploaded as an
#            artifact
#   release  on main, publishes that APK as the latest GitHub release, which
#            the app's update check and the README's download link point at
# See mobile/bridge/README.md and mobile/android/README.md for the same steps
# run by hand.
on:
  pull_request:
    paths: &paths
      - 'mobile/**'
      - 'src/libslic3r/**'
      - 'deps_src/**'
      - 'resources/profiles/**'
      - 'version.inc'
      - '.github/workflows/android.yml'
  push:
    branches:
      - main
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018
  # GitHub's Linux runners have 4 cores.
  ORCAPOD_JOBS: 4

jobs:
  host:
    name: Engine and JNI tests (Linux host)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build libgmp-dev libmpfr-dev
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # Boost, CGAL, Eigen, oneTBB and the other pinned engine sources.
      - name: Cache engine sources
        uses: actions/cache@v6
        with:
          path: mobile/bridge/cache
          key: engine-sources-host-${{ hashFiles('mobile/bridge/engine-sources.sh', 'mobile/bridge/tools/gen_nlopt.py') }}
      - name: Build the engine and run its tests
        run: mobile/bridge/build-host.sh --test
      - name: Run the app's JNI tests
        run: mobile/android/tools/host-jni-test.sh
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: host-test-reports
          path: mobile/android/app/build/reports/tests/
          if-no-files-found: ignore

  android:
    name: Android engine and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build qemu-user
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install the Android NDK and SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;3.22.1" "platforms;android-35" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      # The pinned engine sources, plus the GMP and MPFR tarballs (checked
      # against their SHA-256 on every build).
      - name: Cache engine sources
        uses: actions/cache@v6
        with:
          path: mobile/bridge/cache
          key: engine-sources-android-${{ hashFiles('mobile/bridge/engine-sources.sh', 'mobile/bridge/tools/gen_nlopt.py', 'mobile/bridge/build-android.sh') }}
      - name: Build the engine for arm64-v8a and run the CLI smoke test
        run: mobile/bridge/build-android.sh --test
      # The release signing key (see "Updates" in docs/HLSD/android-app.md).
      # Without the secrets (forks, or before they are added) the APK gets a
      # throwaway debug key and is not published.
      - name: Load the signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ORCAPOD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ORCAPOD_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            # Pasting a secret can add line breaks or spaces; neither belongs
            # in base64 or in the generated password.
            password="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')"
            echo "::add-mask::$password"
            keystore="$RUNNER_TEMP/orcapod.keystore"
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"
            if ! keytool -list -keystore "$keystore" -storepass "$password" -alias orcapod > /dev/null; then
              echo "::error::The ORCAPOD_KEYSTORE_BASE64 and ORCAPOD_KEYSTORE_PASSWORD secrets do not open a keystore with the key 'orcapod'; paste both again."
              exit 1
            fi
            echo "ORCAPOD_KEYSTORE=$keystore" >> "$GITHUB_ENV"
            echo "ORCAPOD_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ORCAPOD_KEYSTORE_BASE64 and ORCAPOD_KEYSTORE_PASSWORD are not set; this APK cannot update an installed release."
          fi
      - name: Run the app's unit tests and build the APK
        working-directory: mobile/android
        # The run number is the version code, so each build installs over the
        # last one (all builds share the signing key in app/build.gradle.kts).
        run: >-
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          -Porcapod.versionCode=${{ github.run_number }}
          -Porcapod.updateRepo=${{ github.repository }}
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: orcapod-apk
          path: mobile/android/app/build/outputs/apk/debug/OrcaPod-*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: mobile/android/app/build/reports/tests/
          if-no-files-found: ignore

  release:
    name: Publish the APK
    needs: [host, android]
    # Only builds signed with the release key go out, so each one installs over the last.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.android.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: android-build-${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: orcapod-apk
          path: apk
      # A fixed asset name keeps releases/latest/download/OrcaPod.apk a
      # permanent link to the newest build.
      - name: Create the release
        run: |
          cp apk/OrcaPod-*.apk OrcaPod.apk
          gh release create "$TAG" OrcaPod.apk \
            --target "$GITHUB_SHA" --latest \
            --title "OrcaPod build ${{ github.run_number }}" \
            --notes "Android app built from ${GITHUB_SHA::7}. Install it over any earlier OrcaPod build from these releases; your projects and settings are kept."
      - name: Keep the newest 10 app releases
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' |
            grep '^android-build-' | sort -t- -k3 -n -r | tail -n +11 |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
