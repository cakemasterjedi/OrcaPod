name: 🚀 Feature request
description: Suggest something that would make OrcaPod better
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please search the existing issues first. If someone already asked for it, add a 👍 and a comment there.
  - type: textarea
    attributes:
      label: What problem would this solve?
      placeholder: When I'm preparing a print, I can't [...]
    validations:
      required: true
  - type: textarea
    attributes:
      label: What would you like OrcaPod to do?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Anything else?
      description: Alternatives you've considered, screenshots, or how another slicer does it.
    validations:
      required: false
