org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Directory holding the engine bridge built by mobile/bridge/build-android.sh
# (one <abi>/liborcapod.so per ABI), relative to this project.
orcapod.bridgeDir=../bridge/build-android
# ABIs to package; each needs its liborcapod.so in orcapod.bridgeDir.
orcapod.abis=arm64-v8a
